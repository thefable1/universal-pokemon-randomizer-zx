name: Release

# Tag push (v*) or manual dispatch builds all platforms and publishes a DRAFT
# release. Linux uses the plugin-bypass for AppImage: `tauri build` assembles the
# AppDir (its bundled linuxdeploy chokes on our embedded JRE), then
# build-appimage.sh packages the AppDir with the appimage plugin directly --
# the same technique that works locally and in Zephyr's local scripts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for this release (e.g. 4.6.2)'
        required: true
        default: '4.6.2'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            label: Linux
            target: ''
            artifacts: |
              tauri-ui/src-tauri/target/release/bundle/appimage/*.AppImage
              tauri-ui/src-tauri/target/release/bundle/deb/*.deb
              tauri-ui/src-tauri/target/release/bundle/rpm/*.rpm
          - platform: windows-latest
            label: Windows
            target: ''
            artifacts: |
              tauri-ui/src-tauri/target/release/bundle/nsis/*-setup.exe
              tauri-ui/src-tauri/target/release/bundle/msi/*.msi
          - platform: macos-latest
            label: macOS (Apple Silicon)
            target: aarch64-apple-darwin
            artifacts: tauri-ui/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: macos-latest
            label: macOS (Intel)
            target: x86_64-apple-darwin
            artifacts: tauri-ui/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: tauri-ui/pnpm-lock.yaml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-ui/src-tauri

      # Pin WebKitGTK 2.44.0: newer versions crash wry/Tauri at runtime.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev libudev-dev patchelf rpm file \
            libwebkit2gtk-4.1-0=2.44.0-2 \
            libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 \
            libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
            gir1.2-webkit2-4.1=2.44.0-2

      - name: Install frontend dependencies
        working-directory: tauri-ui
        run: pnpm install --frozen-lockfile

      - name: Stamp version
        shell: bash
        working-directory: tauri-ui
        run: |
          pnpm pkg set version=${{ steps.ver.outputs.version }}
          sed -i.bak 's/"version": "[^"]*"/"version": "${{ steps.ver.outputs.version }}"/' src-tauri/tauri.conf.json
          sed -i.bak 's/^version = "[^"]*"/version = "${{ steps.ver.outputs.version }}"/' src-tauri/Cargo.toml
          rm -f src-tauri/tauri.conf.json.bak src-tauri/Cargo.toml.bak

      # `tauri build` runs prep:bridge (engine fat jar + jlink'd JRE) via
      # beforeBuildCommand. On Linux we attempt deb/rpm/appimage; linuxdeploy
      # fails on the embedded JRE, but the AppDir is assembled first, so
      # build-appimage.sh then packages it with the appimage plugin directly.
      - name: Build
        working-directory: tauri-ui
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1 # no FUSE on runners
          NO_STRIP: true
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            pnpm tauri build --bundles deb,rpm,appimage || echo "::warning::linuxdeploy failed (expected); packaging AppImage via plugin"
            pnpm appimage
          else
            pnpm tauri build ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upr-zx-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Universal Pokémon Randomizer ZX v${{ steps.ver.outputs.version }}
          draft: true
          files: ${{ matrix.artifacts }}
          fail_on_unmatched_files: false

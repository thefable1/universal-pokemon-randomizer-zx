name: Release

# Push a tag like `v4.6.2` to build all platforms and publish a GitHub Release.
# `workflow_dispatch` runs it manually (artifacts only, no release).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 — AppImage (+ .deb). 22.04's older glibc = wider portability.
          - os: ubuntu-22.04
            artifacts: |
              tauri-ui/src-tauri/target/release/bundle/appimage/*.AppImage
              tauri-ui/src-tauri/target/release/bundle/deb/*.deb
          # Windows x64 — NSIS installer (+ MSI).
          - os: windows-latest
            artifacts: |
              tauri-ui/src-tauri/target/release/bundle/nsis/*-setup.exe
              tauri-ui/src-tauri/target/release/bundle/msi/*.msi
          # macOS Apple Silicon (arm64) — DMG.
          - os: macos-14
            artifacts: tauri-ui/src-tauri/target/release/bundle/dmg/*.dmg
          # macOS Intel (x64) — DMG.
          - os: macos-13
            artifacts: tauri-ui/src-tauri/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Linux-only: Tauri build deps + FUSE (AppImage) + file (linuxdeploy).
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf libfuse2 file desktop-file-utils

      # JDK provides javac/jlink/jdeps for the engine fat jar + the per-OS JRE.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: tauri-ui/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-ui/src-tauri

      - name: Install frontend dependencies
        working-directory: tauri-ui
        run: pnpm install --frozen-lockfile

      # `tauri build` runs prep:bridge (engine fat jar + jlink'd JRE for THIS OS)
      # via beforeBuildCommand, then bundles. On Linux the linuxdeploy step can
      # fail; the AppDir + .deb exist first, so `pnpm appimage` finishes the
      # AppImage from the cached plugin. Windows/macOS bundle natively.
      - name: Build
        working-directory: tauri-ui
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            pnpm tauri build || echo "::warning::tauri build exited non-zero (likely linuxdeploy); finishing AppImage manually"
            pnpm appimage
          else
            pnpm tauri build
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upr-zx-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      # On a tag push, attach this OS's artifacts to the (shared) GitHub Release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}
          generate_release_notes: true
